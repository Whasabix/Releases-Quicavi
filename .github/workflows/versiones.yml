# Publica cada versión de versiones/lista.txt como una Release de GitHub
# (con su .zip y su nota de versiones/notas/), si todavía no existe.
# Después saca del repo los .zip ya publicados: las descargas viven solo en
# Releases y la carpeta versiones/ queda limpia.
# Corre sola al subir cambios a main; también se puede lanzar a mano.
name: Publicar versiones

on:
  push:
    branches: [main]
    paths: ["versiones/**", ".github/workflows/versiones.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear las Releases que falten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(grep -v '^#' versiones/lista.txt | grep -v '^\s*$' | tail -1 | cut -d'|' -f1 | xargs)
          grep -v '^#' versiones/lista.txt | grep -v '^\s*$' | while IFS='|' read -r tag file title; do
            tag=$(echo "$tag" | xargs); file=$(echo "$file" | xargs); title=$(echo "$title" | xargs)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag ya existe"
              continue
            fi
            latest="--latest=false"
            if [ "$tag" = "$last" ]; then latest="--latest"; fi
            gh release create "$tag" "versiones/$file" --title "$title" --notes-file "versiones/notas/$tag.md" $latest
            echo "$tag publicada"
          done
      - name: Sacar del repo los .zip que ya están en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for zip in versiones/*.zip; do
            file=$(basename "$zip")
            tag=$(grep -v '^#' versiones/lista.txt | awk -F'|' -v f="$file" '{gsub(/ /,"",$1); g=$2; gsub(/ /,"",g); if (g==f) print $1}')
            if [ -n "$tag" ] && gh release view "$tag" --json assets -q '.assets[].name' | grep -qx "$file"; then
              git rm -q "$zip"
              echo "$file ya está en la Release $tag: se saca del repo"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Sacar del repo los .zip ya publicados en Releases"
            git push
          fi
